<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b8df6"/>
      <stop offset="1" stop-color="#2454d4"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe7fb"/>
    </linearGradient>
    <clipPath id="lensClip">
      <circle cx="450" cy="450" r="242"/>
    </clipPath>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>

  <!-- lens interior -->
  <circle cx="450" cy="450" r="242" fill="#1c3fae"/>

  <!-- log lines inside lens: one red error line -->
  <g clip-path="url(#lensClip)">
    <rect x="290" y="282" width="310" height="78" rx="39" fill="#ffffff"/>
    <rect x="255" y="411" width="390" height="78" rx="39" fill="#ff4d4d"/>
    <rect x="310" y="540" width="255" height="78" rx="39" fill="#ffffff"/>
  </g>

  <!-- handle -->
  <line x1="692" y1="692" x2="878" y2="878" stroke="url(#glyph)" stroke-width="135" stroke-linecap="round"/>

  <!-- rim -->
  <circle cx="450" cy="450" r="280" fill="none" stroke="url(#glyph)" stroke-width="78"/>
</svg>
