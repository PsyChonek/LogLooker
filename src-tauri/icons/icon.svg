<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3a55"/>
      <stop offset="1" stop-color="#0e1626"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.35" cy="0.3" r="1.1">
      <stop offset="0" stop-color="#93c5fd" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1e3a8a" stop-opacity="0.38"/>
    </radialGradient>
    <clipPath id="bgClip">
      <rect x="32" y="32" width="960" height="960" rx="224"/>
    </clipPath>
    <clipPath id="lensClip">
      <circle cx="640" cy="600" r="192"/>
    </clipPath>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>
  <rect x="40" y="40" width="944" height="944" rx="216" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="16"/>

  <g clip-path="url(#bgClip)">
    <!-- log rows: timestamp chip + message bar -->
    <g>
      <rect x="144" y="168" width="96" height="52" rx="26" fill="#5d6d88"/>
      <rect x="268" y="168" width="420" height="52" rx="26" fill="#3f4d68"/>

      <rect x="144" y="264" width="96" height="52" rx="26" fill="#5d6d88"/>
      <rect x="268" y="264" width="540" height="52" rx="26" fill="#3f4d68"/>

      <rect x="144" y="360" width="96" height="52" rx="26" fill="#5d6d88"/>
      <rect x="268" y="360" width="360" height="52" rx="26" fill="#3f4d68"/>

      <rect x="144" y="456" width="96" height="52" rx="26" fill="#5d6d88"/>
      <rect x="268" y="456" width="480" height="52" rx="26" fill="#3f4d68"/>

      <rect x="144" y="552" width="96" height="52" rx="26" fill="#5d6d88"/>
      <rect x="268" y="552" width="460" height="52" rx="26" fill="#dc2626"/>

      <rect x="144" y="648" width="96" height="52" rx="26" fill="#5d6d88"/>
      <rect x="268" y="648" width="380" height="52" rx="26" fill="#3f4d68"/>

      <rect x="144" y="744" width="96" height="52" rx="26" fill="#5d6d88"/>
      <rect x="268" y="744" width="520" height="52" rx="26" fill="#3f4d68"/>
    </g>

    <!-- lens: glass fill, magnified rows, rim, handle -->
    <circle cx="640" cy="600" r="192" fill="url(#glass)"/>
    <g clip-path="url(#lensClip)">
      <g transform="translate(640 600) scale(1.5) translate(-640 -600)">
        <rect x="144" y="456" width="96" height="52" rx="26" fill="#8496b3"/>
        <rect x="268" y="456" width="480" height="52" rx="26" fill="#5a6a88"/>

        <rect x="144" y="552" width="96" height="52" rx="26" fill="#8496b3"/>
        <rect x="268" y="552" width="460" height="52" rx="26" fill="#ef4444"/>

        <rect x="144" y="648" width="96" height="52" rx="26" fill="#8496b3"/>
        <rect x="268" y="648" width="380" height="52" rx="26" fill="#5a6a88"/>
      </g>
    </g>

    <line x1="800" y1="760" x2="922" y2="882" stroke="url(#handle)" stroke-width="92" stroke-linecap="round"/>
    <circle cx="640" cy="600" r="192" fill="none" stroke="url(#rim)" stroke-width="52"/>
    <path d="M 505 480 A 172 172 0 0 1 630 428" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="22" stroke-linecap="round"/>
  </g>
</svg>
