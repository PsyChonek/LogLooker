name: Release

# Manual, like SqlPlanForDummies: pick a bump, and CI does the whole release -
# version bump, MSI build, winget manifests, tag, GitHub release, winget PR.
# Nothing has to be built or tagged locally first.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      skip_tests:
        description: 'Skip CI tests before release'
        required: false
        default: false
        type: boolean
      skip_winget:
        description: 'Build and release, but do not open a winget PR'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tests:
    name: Run CI Tests
    if: github.ref == 'refs/heads/main' && !inputs.skip_tests
    uses: ./.github/workflows/ci.yml

  release:
    needs: [tests]
    # `always()` so a skipped test job does not cancel the release, while a
    # failed one still does
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && (needs.tests.result == 'success' || needs.tests.result == 'skipped')
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Update both package manifests and their lockfiles, plus the Tauri version.
      - name: Bump version
        id: version
        shell: pwsh
        env:
          VERSION_BUMP: ${{ inputs.bump }}
        run: |
          $version = node scripts/bump-version.mjs $env:VERSION_BUMP
          if ($LASTEXITCODE -ne 0) { throw 'Version bump failed' }
          git show-ref --verify --quiet "refs/tags/v$version"
          if ($LASTEXITCODE -eq 0) { throw "Tag v$version already exists" }
          if ($LASTEXITCODE -ne 1) { throw 'Could not check release tag' }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing v$version"
          exit 0

      - name: Build Windows installers (x64)
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Build Windows installers (ARM64)
        run: npm run tauri build -- --target aarch64-pc-windows-msvc

      - name: Collect artifacts
        id: artifacts
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Path release-artifacts -Force | Out-Null
          # Require an MSI and an NSIS installer from each target's bundle folder.
          foreach ($target in @('x86_64-pc-windows-msvc', 'aarch64-pc-windows-msvc')) {
            $bundle = "src-tauri/target/$target/release/bundle"
            foreach ($extension in @('msi', 'exe')) {
              $found = @(Get-ChildItem -LiteralPath $bundle -Recurse -File |
                Where-Object { $_.Name -like "*_${version}_*.$extension" })
              if ($found.Count -ne 1) { throw "Expected one $extension for $target, found $($found.Count)" }
              Copy-Item -LiteralPath $found[0].FullName -Destination release-artifacts/
              Write-Host "  $($found[0].Name)"
            }
          }
          Get-FileHash -Path release-artifacts/*.msi,release-artifacts/*.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } |
            Out-File release-artifacts/SHA256SUMS.txt -Encoding utf8

      # Reads each MSI's SHA256 and ProductCode out of the file, so the manifests
      # always describe the artifact actually being attached
      - name: Generate winget manifests
        shell: pwsh
        run: ./scripts/update-winget-manifests.ps1 -Version "${{ steps.version.outputs.version }}" -ArtifactsPath "release-artifacts"

      - name: Commit, tag and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock winget/
          # [skip ci] so the release commit does not trigger the push-based CI run
          git commit -m "release: v${{ steps.version.outputs.version }} [skip ci]"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.version.outputs.version }}"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: LogLooker v${{ steps.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-artifacts/*
          body: |
            The installer is not code-signed, so Windows SmartScreen warns on
            first run ("More info" -> "Run anyway").

            ```
            winget install PsyChonek.LogLooker
            ```

  winget:
    needs: release
    if: always() && !cancelled() && needs.release.result == 'success' && !inputs.skip_winget && !github.event.repository.private
    runs-on: windows-latest
    timeout-minutes: 15
    # Gates the WINGET_TOKEN behind an environment, so a fork's workflow cannot
    # reach it
    environment: release
    steps:
      - name: Check winget token
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) {
            throw 'Set WINGET_TOKEN in the release environment, or select skip_winget.'
          }

      - name: Publish to winget
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: PsyChonek.LogLooker
          token: ${{ secrets.WINGET_TOKEN }}
          release-tag: v${{ needs.release.outputs.version }}
          fork-user: PsyChonek
          installers-regex: '_(x64|arm64)_en-US\.msi$'
